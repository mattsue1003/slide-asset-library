<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>簡報素材庫</title>
<meta name="description" content="網頁簡報素材資料庫：模板、字型、配色、背景、版面、轉場、動畫、文字方塊、形狀、圖示、圖表、資訊圖、互動元件、音效，一鍵複製給 Claude 使用，並可直接組成網頁簡報。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="app.css?v=2">
</head>
<body>
<header class="top">
  <button class="menu-btn" id="menuBtn" aria-label="開啟分類選單">☰</button>
  <a class="logo" href="#home"><span class="logo-mark">S</span><span>簡報素材庫</span></a>
  <label class="search"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" placeholder="搜尋素材，例如：便利貼、翻轉、醫療、倒數…"></label>
  <a class="btn ghost" href="#studio">簡報工作室</a>
  <button class="btn primary" id="basketBtn">素材籃 <b id="basketCount">0</b></button>
</header>
<div class="layout">
  <nav class="side" id="side"></nav>
  <main id="view"></main>
</div>

<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head"><h3>素材籃</h3><button class="x" id="drawerClose" aria-label="關閉">✕</button></div>
  <p class="hint">把想用的素材加進來，一次複製成給 Claude 的提示詞，或直接套用到簡報工作室。</p>
  <div id="basketList" class="basket-list"></div>
  <div class="drawer-foot">
    <button class="btn primary" id="copyAll">複製全部（給 Claude）</button>
    <button class="btn" id="toStudio">套用到簡報工作室</button>
    <button class="btn" id="dlMd">下載素材包 .md</button>
    <button class="btn danger" id="clearBasket">清空</button>
  </div>
</aside>
<div class="scrim" id="scrim"></div>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="modal-box">
    <button class="x modal-x" id="modalClose" aria-label="關閉">✕</button>
    <div class="modal-pv" id="modalPv"></div>
    <div class="modal-body">
      <div class="modal-title"><h3 id="mName"></h3><code id="mId"></code></div>
      <p id="mDesc" class="muted"></p>
      <div class="modal-acts" id="mActs"></div>
      <div class="tabs" id="mTabs"></div>
      <pre class="code" id="mCode"></pre>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="data-core.js?v=2"></script>
<script src="data-text.js?v=2"></script>
<script src="data-design.js?v=2"></script>
<script src="data-blocks.js?v=2"></script>
<script src="data-interactive.js?v=2"></script>
<script src="app.js?v=2"></script>
<script src="https://mattsue1003.github.io/oth-report-button/report.js" data-site="簡報素材庫" defer></script>
<script>
window.addEventListener('load',function(){
  (function shrink(n){
    var host=document.querySelector('[data-oth-report]');
    if(!host||!host.shadowRoot){if(n<20)setTimeout(function(){shrink(n+1)},300);return}
    var s=document.createElement('style');
    s.textContent='.fab{left:14px!important;right:auto!important;bottom:14px!important;width:34px!important;height:34px!important;min-width:0!important;padding:0!important;gap:0!important;justify-content:center!important;border-radius:50%!important;overflow:hidden!important;font-size:0!important;white-space:nowrap!important;opacity:.75}.fab svg{width:16px!important;height:16px!important;flex:none;margin:0!important}@media (hover:hover){.fab:hover{width:auto!important;padding:0 14px!important;gap:6px!important;font-size:13px!important;border-radius:99px!important;opacity:1}}';
    host.shadowRoot.appendChild(s);
  })(0);
});
</script>
</body>
</html>
